# Production Configuration for Render
# Optimized for low-memory environment (512MB)

# Disable unnecessary features
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
management.health.mail.enabled=false
spring.jmx.enabled=false

# Disable embeddings in production (saves ~250MB RAM)
# RAG/semantic search features will be disabled but core functionality works
DISABLE_EMBEDDINGS=true

# Optimize Hibernate for memory
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=10
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=64
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=32

# Reduce logging overhead
logging.level.root=WARN
logging.level.com.revive=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Optimize Tomcat for low memory
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=50
server.tomcat.accept-count=10
server.tomcat.connection-timeout=20000

# Reduce connection pool (override default)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

# Disable unnecessary actuator endpoints
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
