services:
  # Backend Service
  - type: web
    name: revive-backend
    runtime: java
    plan: starter  # Upgrade from free tier (512MB) to starter (512MB but better performance)
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: chmod +x backend/render-start.sh && ./backend/render-start.sh
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 86400000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://revive-backend.onrender.com/login/oauth2/code/google
      - key: APP_OAUTH2_REDIRECT_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: RESEND_FROM_NAME
        value: Revive
      - key: APP_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VISION_PRIMARY
        value: gemini-3.6-flash
      - key: GEMINI_TEXT_PRIMARY
        value: gemini-3.5-flash-lite
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: REVIVE_SEED_ADMIN
        value: true
      - key: DISABLE_EMBEDDINGS
        value: true
      - key: AI_MAX_CATEGORIZATION_REQUESTS_PER_DAY
        value: 100
      - key: AI_MAX_RECEIPT_UPLOADS_PER_DAY
        value: 20
      - key: AI_RETRY_ATTEMPTS
        value: 3
      - key: AI_RETRY_DELAY_MS
        value: 1000
