# Test Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for tests
spring.flyway.enabled=false

# JWT Configuration
jwt.secret=test-secret-key-at-least-256-bits-long-for-hs256-algorithm-test
jwt.expiration=86400000

# Disable external services for tests
DISABLE_EMBEDDINGS=true

# Test Mode Razorpay
RAZORPAY_KEY_ID=rzp_test_demo
RAZORPAY_KEY_SECRET=test_secret

# Disable email in tests
RESEND_API_KEY=test_key
RESEND_FROM_EMAIL=test@test.com

# AI Configuration (tests should use mocks or fallbacks)
GEMINI_API_KEY=test_key
GROQ_API_KEY=test_key

# Logging
logging.level.com.revive=INFO
logging.level.org.springframework=WARN
